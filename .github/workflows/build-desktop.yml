name: Build Windows and macOS

on:
  workflow_dispatch:
  push:
    branches: [port-gd-2.2091]
  pull_request:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: windows
            cli-profile: win
          - name: macOS
            os: macos-latest
            platform: mac
            cli-profile: mac-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout Geode SDK (v6)
        uses: actions/checkout@v4
        with:
          repository: geode-sdk/geode
          ref: v6.0.0-alpha.1
          path: geode-sdk

      - name: Set GEODE_SDK
        run: echo "GEODE_SDK=${{ github.workspace }}/geode-sdk" >> "$GITHUB_ENV"
        shell: bash

      - name: Set up Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main
        with:
          version: 'v4.0.0'

      - name: Create CLI profile (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "Geode"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $gd = Join-Path $env:RUNNER_TEMP "gd"
          New-Item -ItemType Directory -Force -Path (Join-Path $gd "geode/mods") | Out-Null
          $json = @{
            "current-profile" = "ci"
            "profiles" = @(@{ name = "ci"; "gd-path" = $gd; platform = "${{ matrix.cli-profile }}" })
            "sdk-nightly" = $false
          } | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText((Join-Path $dir "config.json"), $json)

      - name: Create CLI profile (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          GD="$RUNNER_TEMP/gd"
          mkdir -p "$GD/geode/mods"
          sudo mkdir -p /Users/Shared/Geode
          echo "{\"current-profile\":\"ci\",\"profiles\":[{\"name\":\"ci\",\"gd-path\":\"$GD\",\"platform\":\"${{ matrix.cli-profile }}\"}],\"sdk-nightly\":false}" | sudo tee /Users/Shared/Geode/config.json > /dev/null
          sudo chown -R "$(id -un)" /Users/Shared/Geode

      - name: Build Geode loader from source
        shell: bash
        run: |
          cmake -S geode-sdk -B geode-sdk/build-loader -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build geode-sdk/build-loader --config RelWithDebInfo --target geode-loader --parallel

      - name: Build Mod
        run: geode build --platform ${{ matrix.platform }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: multiplayer-edit-${{ matrix.platform }}
          path: build/*.geode
