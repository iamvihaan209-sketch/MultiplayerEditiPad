name: Build Windows and macOS

on:
  workflow_dispatch:
  push:
    branches: [port-gd-2.2091]
  pull_request:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: windows
            cli-profile: win
          - name: macOS
            os: macos-latest
            platform: mac
            cli-profile: mac-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout Geode SDK (v6)
        uses: actions/checkout@v4
        with:
          repository: geode-sdk/geode
          ref: v6.0.0-alpha.1
          path: geode-sdk

      - name: Set GEODE_SDK
        run: echo "GEODE_SDK=${{ github.workspace }}/geode-sdk" >> "$GITHUB_ENV"
        shell: bash

      - name: Set up Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      - name: Create CLI profile (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "Geode"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $json = '{"current-profile":"ci","profiles":[{"name":"ci","gd-path":"ci-placeholder","platform":"${{ matrix.cli-profile }}"}],"sdk-nightly":false}'
          [IO.File]::WriteAllText((Join-Path $dir "config.json"), $json)

      - name: Create CLI profile (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          sudo mkdir -p /Users/Shared/Geode
          echo '{"current-profile":"ci","profiles":[{"name":"ci","gd-path":"ci-placeholder","platform":"${{ matrix.cli-profile }}"}],"sdk-nightly":false}' | sudo tee /Users/Shared/Geode/config.json > /dev/null
          sudo chown -R "$(id -un)" /Users/Shared/Geode

      - name: Install Geode loader binaries
        shell: bash
        run: geode sdk install-binaries --version 6.0.0-alpha.1

      - name: Build Mod
        run: geode build --platform ${{ matrix.platform }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: multiplayer-edit-${{ matrix.platform }}
          path: build/*.geode
